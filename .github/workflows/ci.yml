name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  # Nightly, so a change in the runners or the toolchain shows up even on a
  # day with no merge; and a "Run workflow" button for a manual run.
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Two kernels and userlands GitHub offers; older kernels and other
        # distributions run in VMs: bench/matrix/lima-matrix.sh.
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    env:
      # The runner has passwordless sudo: the full-disk test must run.
      FOIL_REQUIRE_SUDO: "1"
      FOIL_DIFF_CASES: "500"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # Ubuntu >= 23.10 restricts unprivileged user namespaces; `foil setup`
      # installs the AppArmor profile that lets the foil binary use them, as
      # a customer would. From here on, branch and isolation tests must run.
      - name: Allow foil to use user namespaces
        run: |
          cargo build
          sudo target/debug/foil setup
          echo "FOIL_REQUIRE_BRANCH=1" >> "$GITHUB_ENV"

      # The runner's own cgroup is not delegated and there is no systemd user
      # session yet, so this run exercises the subreaper-only fallback
      # (cgroup and limit tests skip themselves).
      - name: Test (fallback, no cgroup box)
        run: cargo test --all-targets

      # Start a systemd user manager so the runner gets a delegated cgroup.
      - name: Enable a systemd user session
        run: |
          sudo loginctl enable-linger "$USER"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          for i in $(seq 30); do [ -S "/run/user/$(id -u)/bus" ] && break; sleep 1; done

      - name: Test (cgroup box and limits required)
        run: systemd-run --user --scope -q env FOIL_REQUIRE_CGROUP=1 FOIL_REQUIRE_LIMITS=1 cargo test --all-targets

      - name: Doctor
        run: target/debug/foil doctor

  # Speed (family J): measured on every push and kept as an artifact; gated
  # against the commit's base (bench/baseline-ci.json is a reference point).
  bench:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      # The gate compares this commit with its base (the PR's target, or the
      # previous commit on a push), built and measured on the same runner,
      # in turns: runner speed drifts too much for a fixed baseline (main
      # itself measured 11 to 30 ms for branch_start within a week).
      - name: Build this commit and its base
        run: |
          base=${{ github.event.pull_request.base.sha || github.event.before }}
          git cat-file -e "$base^{commit}" 2>/dev/null || base=$(git rev-parse HEAD~1)
          cargo build --release
          cp target/release/foil /tmp/foil-new
          git worktree add /tmp/base "$base"
          (cd /tmp/base && cargo build --release && cp target/release/foil /tmp/foil-base)
          sudo /tmp/foil-new setup
          sudo /tmp/foil-base setup
      - name: foilbench (base, this commit, base, this commit)
        run: |
          for round in 1 2; do
            FOIL=/tmp/foil-base python3 bench/foilbench.py --quick --out base-$round.json
            FOIL=/tmp/foil-new python3 bench/foilbench.py --quick --out foilbench-$round.json
          done
          cp foilbench-2.json foilbench.json
      - name: Gate against the base
        run: |
          # A regression must show in both rounds to count (one noisy round is not one).
          if python3 bench/foilbench.py --gate base-1.json --tolerance 0.5 foilbench-1.json; then exit 0; fi
          python3 bench/foilbench.py --gate base-2.json --tolerance 0.5 foilbench-2.json
      - name: Show the numbers
        run: cat foilbench.json
      # Uploads can fail when the account's artifact quota is full; the
      # numbers are in the log above either way.
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: foilbench
          path: foilbench.json
          retention-days: 7

  # macOS: APFS-clone branches and the Seatbelt sandbox (src/mac/), on
  # Apple silicon and Intel.
  macos:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --all-targets
      - name: Doctor
        run: target/debug/foil doctor

  # `foil serve` with the unmodified OpenSandbox Python SDK, plain and
  # strict; on Linux also OpenSandbox's own server tests for the foil
  # runtime (integrations/opensandbox/runtime), on the commit it is based on.
  opensandbox:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: cargo build
      - name: Allow foil to use user namespaces
        if: runner.os == 'Linux'
        run: sudo target/debug/foil setup
      - name: SDK end to end
        run: |
          python -m pip install -q opensandbox httpx
          FOIL=$PWD/target/debug/foil integrations/opensandbox/run-e2e.sh
          FOIL=$PWD/target/debug/foil integrations/opensandbox/run-e2e.sh --strict
      - name: OpenSandbox server with the foil runtime
        if: runner.os == 'Linux'
        run: |
          base=$(cat integrations/opensandbox/runtime/BASE)
          git clone -q https://github.com/alibaba/OpenSandbox /tmp/osb
          git -C /tmp/osb checkout -q "$base"
          git -C /tmp/osb apply "$PWD/integrations/opensandbox/runtime/opensandbox-foil-runtime.patch"
          pip install -q uv
          cd /tmp/osb/server
          SETUPTOOLS_SCM_PRETEND_VERSION=0.0.0 uv sync -q
          FOIL_BIN=$GITHUB_WORKSPACE/target/debug/foil uv run pytest -q -p no:warnings tests/test_foil_service.py tests/test_config.py

  # The same suite inside a Docker container, with the settings from
  # contrib/docker/README.md.
  container:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build && cargo test --no-run --all-targets
      - name: Allow foil to use user namespaces (host AppArmor)
        run: sudo target/debug/foil setup
      - name: Test inside a container
        run: contrib/docker/test-in-container.sh

  # A static binary on every push (kept 7 days); on a v* tag, also a
  # GitHub release with the binary and its SHA-256 (what install.sh fetches).
  release:
    needs: [test, container]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - name: Static binary
        run: |
          sudo apt-get install -y musl-tools
          cargo build --release --target x86_64-unknown-linux-musl
          mkdir dist
          cp target/x86_64-unknown-linux-musl/release/foil dist/foil-x86_64-linux
          cd dist && sha256sum foil-x86_64-linux > foil-x86_64-linux.sha256
      - name: Smoke test the static binary
        run: |
          sudo dist/foil-x86_64-linux setup
          dist/foil-x86_64-linux doctor
          FOIL=$PWD/dist/foil-x86_64-linux sh examples/best-of-n/demo.sh
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: foil-x86_64-linux
          path: dist/
          retention-days: 7
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(awk -v v="${GITHUB_REF_NAME#v}" '$0 ~ "^## " v {on=1; next} /^## / {on=0} on' CHANGELOG.md)
          gh release create "$GITHUB_REF_NAME" dist/* --title "foil $GITHUB_REF_NAME" --notes "$notes"

  # One macOS binary for Apple silicon and Intel (lipo), smoke-tested, and on
  # a v* tag added to the release the Linux job created.
  release-macos:
    needs: [macos, release]
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Universal binary
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          mkdir dist
          lipo -create -output dist/foil-macos-universal \
            target/aarch64-apple-darwin/release/foil target/x86_64-apple-darwin/release/foil
          cd dist && shasum -a 256 foil-macos-universal > foil-macos-universal.sha256
      - name: Smoke test the binary
        run: |
          dist/foil-macos-universal doctor
          FOIL=$PWD/dist/foil-macos-universal sh examples/best-of-n/demo.sh
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: foil-macos-universal
          path: dist/
          retention-days: 7
      - name: Add to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/*
